<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA 智能手表 运动健康 - 淘宝网</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f4f4f4; color: #333;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    a { text-decoration: none; color: inherit; }
    .topbar { background: #fff; border-bottom: 1px solid #eee; }
    .topbar-inner {
      max-width: 1200px; margin: 0 auto; height: 64px; padding: 0 20px;
      display: flex; align-items: center; gap: 26px;
    }
    .taobao-logo {
      display: flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 800;
      color: #ff5000; letter-spacing: -1px; flex: none;
    }
    .taobao-logo span {
      width: 34px; height: 34px; border-radius: 9px; background: #ff5000; color: #fff;
      display: grid; place-items: center; font-size: 18px;
    }
    .search {
      flex: 1; max-width: 560px; display: flex; height: 38px;
      border: 2px solid #ff5000; border-radius: 19px; overflow: hidden;
    }
    .search input {
      flex: 1; border: 0; outline: none; padding: 0 15px; font-size: 13px;
      font-family: inherit;
    }
    .search button {
      width: 84px; border: 0; background: #ff5000; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .top-links { margin-left: auto; display: flex; gap: 18px; font-size: 12px; color: #666; }
    .top-links b { color: #ff5000; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 20px 40px; }
    .crumb { font-size: 11.5px; color: #999; margin-bottom: 12px; }
    .crumb a { color: #666; margin-right: 5px; }
    .product {
      display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 34px;
      background: #fff; border-radius: 10px; padding: 22px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .gallery-main {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
      background: #f7f7f7; border: 1px solid #eee;
    }
    .gallery-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 9px; }
    .thumbs img {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 5px;
      border: 2px solid transparent; cursor: pointer; background: #f3f3f3;
    }
    .thumbs img:hover, .thumbs img.active { border-color: #ff5000; }
    .info { min-width: 0; padding: 4px 0; }
    .info h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.45; font-weight: 600; }
    .info .sub { font-size: 12px; color: #999; margin-bottom: 14px; }
    .price-box {
      background: linear-gradient(90deg, #fff3ee, #fff8f3); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .price-main { display: flex; align-items: baseline; gap: 8px; }
    .price-main em { font-style: normal; color: #ff5000; font-size: 12px; }
    .price-main strong { color: #ff5000; font-size: 32px; line-height: 1; }
    .price-main s { color: #aaa; font-size: 12px; }
    .price-meta { display: flex; gap: 22px; font-size: 11px; color: #999; margin-top: 8px; }
    .row { display: flex; align-items: flex-start; gap: 14px; margin: 12px 0; font-size: 12px; }
    .row-label { width: 56px; color: #999; flex: none; padding-top: 7px; }
    .sku { display: flex; gap: 7px; flex-wrap: wrap; }
    .sku span {
      border: 1px solid #ddd; border-radius: 5px; padding: 7px 14px; background: #fff; font-size: 12px;
    }
    .sku span.active { border-color: #ff5000; color: #ff5000; background: #fff8f4; }
    .qty { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 5px; height: 32px; }
    .qty button { width: 30px; height: 30px; border: 0; background: #f7f7f7; font-size: 15px; cursor: pointer; }
    .qty input { width: 46px; height: 30px; border: 0; text-align: center; font-size: 12px; outline: none; }
    .buy-row { display: flex; gap: 10px; margin-top: 22px; }
    .buy-row button {
      width: 168px; height: 44px; border-radius: 6px; border: 0; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .buy-cart { background: #fff3ee; color: #ff5000; border: 1px solid #ff5000 !important; }
    .buy-now { background: #ff5000; color: #fff; }
    .service { display: flex; gap: 18px; margin-top: 16px; font-size: 11px; color: #999; }
    .service span::before { content: "✓"; color: #ff5000; margin-right: 4px; }
    .banner {
      margin-top: 16px; height: 180px; border-radius: 10px; overflow: hidden;
      background: url("images/banner.jpg") center/cover no-repeat;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }
    .detail-card {
      margin-top: 16px; background: #fff; border-radius: 10px; padding: 22px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .detail-title {
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
      font-size: 15px; font-weight: 700; color: #333;
    }
    .detail-title::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: #ff5000; }
    .detail-card img {
      width: 100%; display: block; border-radius: 8px; margin-bottom: 10px; background: #f5f5f5;
    }
    .footer {
      max-width: 1200px; margin: 0 auto; padding: 26px 20px 40px; text-align: center;
      font-size: 10.5px; color: #aaa; line-height: 1.8;
    }
    .footer img { display: none; }
    @media (max-width: 900px) {
      .product { grid-template-columns: 1fr; }
      .gallery-main { max-width: 520px; margin: 0 auto; }
      .top-links { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="taobao-logo" href="#"><span>淘</span>淘宝网</a>
      <div class="search">
        <input value="AURA 智能手表" aria-label="搜索">
        <button>搜索</button>
      </div>
      <div class="top-links">
        <span>消息</span><span>购物车 <b>2</b></span><span>我的淘宝</span>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="crumb"><a href="#">首页</a> &gt; <a href="#">智能穿戴</a> &gt; <a href="#">智能手表</a> &gt; AURA 智能手表</div>

    <section class="product">
      <div class="gallery">
        <div class="gallery-main"><img id="mainImage" src="images/product1.jpg" alt="AURA 智能手表主图"></div>
        <div class="thumbs">
          <img class="active" src="images/product1.jpg" data-src="images/product1.jpg" alt="主图">
          <img src="images/product2.jpg" data-src="images/product2.jpg" alt="细节图 1">
          <img src="images/product3.jpg" data-src="images/product3.jpg" alt="细节图 2">
          <img src="images/product4.jpg" data-src="images/product4.jpg" alt="细节图 3">
          <img src="images/product5.jpg" data-src="images/product5.jpg" alt="细节图 4">
          <img src="images/product6.png" data-src="images/product6.png" alt="香氛图">
        </div>
      </div>

      <div class="info">
        <h1>AURA 智能手表 运动健康监测 50 米防水 14 天续航</h1>
        <p class="sub">官方旗舰店 · 正品保障 · 7 天无理由退换</p>

        <div class="price-box">
          <div class="price-main">
            <em>¥</em><strong>699</strong><s>¥ 899</s>
            <span style="margin-left:auto;font-size:11px;color:#ff5000;">限时直降 200 元</span>
          </div>
          <div class="price-meta"><span>月销 2,386 件</span><span>累计评价 8,921</span><span>运费：包邮</span></div>
        </div>

        <div class="row">
          <span class="row-label">颜色</span>
          <div class="sku"><span class="active">曜石黑</span><span>雾霾蓝</span><span>薄荷绿</span></div>
        </div>
        <div class="row">
          <span class="row-label">版本</span>
          <div class="sku"><span>标准版</span><span class="active">运动版</span><span>NFC 版</span></div>
        </div>
        <div class="row">
          <span class="row-label">数量</span>
          <div class="qty"><button>−</button><input value="1" aria-label="数量"><button>＋</button></div>
        </div>

        <div class="buy-row">
          <button class="buy-cart">加入购物车</button>
          <button class="buy-now">立即购买</button>
        </div>
        <div class="service"><span>正品保障</span><span>极速退款</span><span>7 天无理由</span></div>
      </div>
    </section>

    <div class="banner" role="img" aria-label="AURA 智能穿戴活动横幅"></div>

    <section class="detail-card">
      <div class="detail-title">商品详情</div>
      <img src="images/detail1.jpg" data-src="images/detail1.jpg" alt="14 天续航">
      <img class="lazy" src="images/pixel.png" data-src="images/detail2.jpg" alt="50 米防水">
      <img class="lazy" src="images/pixel.png" data-src="images/detail3.jpg" alt="全天心率监测">
    </section>
  </div>

  <footer class="footer">
    <img src="images/logo.png" alt="店铺 Logo">
    <img src="images/pixel.png" alt="占位图">
    本页面仅用于「图提取 ImageGrab」插件功能演示，非真实商品页面。
  </footer>

  <script>
    // 模拟电商页面的懒加载：进入视口后再替换真实图片地址
    (function () {
      const lazyImages = Array.from(document.querySelectorAll('img.lazy'));
      const load = (img) => {
        if (img.dataset.src && img.src.indexOf('pixel.png') !== -1) img.src = img.dataset.src;
      };
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              load(entry.target);
              observer.unobserve(entry.target);
            }
          });
        }, { rootMargin: '120px' });
        lazyImages.forEach(img => observer.observe(img));
      } else {
        lazyImages.forEach(load);
      }
      // 缩略图切换主图
      document.querySelectorAll('.thumbs img').forEach(thumb => {
        thumb.addEventListener('click', () => {
          document.querySelectorAll('.thumbs img').forEach(item => item.classList.remove('active'));
          thumb.classList.add('active');
          document.getElementById('mainImage').src = thumb.dataset.src || thumb.src;
        });
      });
    })();
  </script>
</body>
</html>
